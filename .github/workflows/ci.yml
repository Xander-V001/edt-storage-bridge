name: Build and test (manual)

# Never build on push or PR. Explicit user approval required for every invocation.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: storage-bridge-actions
  cancel-in-progress: false

jobs:
  tycho:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      P2_USER: ${{ secrets.P2_USER }}
      P2_TOKEN: ${{ secrets.P2_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check authorized access to the 1C:EDT p2 repository
        shell: bash
        run: |
          if [[ -z "$P2_USER" || -z "$P2_TOKEN" ]]; then
            echo "::error title=1C ITS credentials missing::Configure repository Actions secrets P2_USER and P2_TOKEN before building against EDT 2026.2."
            exit 1
          fi
          echo "1C p2 credentials: configured (values are never printed)."
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk+fx
          cache: maven
      - name: Set up pinned Maven 3.9.9 and JDK 25
        uses: s4u/setup-maven-action@v1.20.0
        with:
          maven-version: '3.9.9'
          java-version: '25'
          checkout-enabled: false
          settings-servers: '[{"id":"dt_repository","username":"${env.P2_USER}","password":"${env.P2_TOKEN}"}]'
      - name: Validate Maven and Java
        run: |
          java -version
          mvn --version
      # A new OSGi qualifier makes each approved build updateable through p2,
      # even when the feature's major/minor/micro version stays 0.1.0.
      - name: Compile, run OSGi tests, build p2 site
        shell: bash
        run: |
          qualifier="$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_NUMBER}"
          echo "Tycho OSGi build qualifier: $qualifier"
          mvn -B -ntp "-DforceContextQualifier=$qualifier" clean verify

      - name: Validate p2 update-site contents
        shell: bash
        run: |
          set -euo pipefail
          site="repository/org.xander.edt.storagebridge.p2/target/repository"
          test -d "$site"
          test -d "$site/features"
          test -d "$site/plugins"
          if ! { test -s "$site/content.jar" || test -s "$site/content.xml" || test -s "$site/content.xml.xz"; }; then
            echo "::error::Missing p2 installable unit metadata (content)"
            exit 1
          fi
          if ! { test -s "$site/artifacts.jar" || test -s "$site/artifacts.xml" || test -s "$site/artifacts.xml.xz"; }; then
            echo "::error::Missing p2 artifact metadata"
            exit 1
          fi
          test -n "$(find "$site/features" -maxdepth 1 -name 'org.xander.edt.storagebridge.feature_*.jar' -print -quit)"
          for bundle in core platform edt ui; do
            test -n "$(find "$site/plugins" -maxdepth 1 -name "org.xander.edt.storagebridge.${bundle}_*.jar" -print -quit)"
          done
          # This public site is allowed to host OUR code only, never vendor EDT jars.
          if find "$site/plugins" "$site/features" -type f \
              \( -name 'com._1c.*' -o -name 'com._1c_*' \) | grep -q .; then
            echo "::error::Refusing to publish proprietary 1C platform bundles"
            exit 1
          fi
          touch "$site/.nojekyll"
          echo "Checked p2 metadata and the four bridge bundles."

      # Upload the site from the SAME explicitly authorized CI run.
      # This does not build anything else, nor does it run on push/PR.
      - name: Stage GitHub Pages p2 update site
        uses: actions/upload-pages-artifact@v4
        with:
          path: repository/org.xander.edt.storagebridge.p2/target/repository
          retention-days: 1
      - name: Upload p2 installation archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: edt-storage-bridge-p2
          path: repository/org.xander.edt.storagebridge.p2/target/*.zip
          if-no-files-found: error
          retention-days: 3
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tycho-test-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove artifacts from previous builds
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prune = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/prune-artifacts.cjs`);
            await prune({github, context, core});

  # Runs ONLY when the manually dispatched build/tests succeeded.
  # No checkout, Maven invocation, or other compilation occurs in this job.
  publish:
    needs: tycho
    if: github.repository == 'Xander-V001/edt-storage-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish p2 update site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
