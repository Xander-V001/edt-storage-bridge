name: Build and test (manual)

# Resource policy: builds are permitted only by explicit user request.
# Do not add push, pull_request, schedule, or workflow_run triggers.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: storage-bridge-actions
  cancel-in-progress: false

jobs:
  tycho:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up pinned Maven 3.9.9
        uses: s4u/setup-maven-action@v1.20.0
        with:
          maven-version: '3.9.9'
          java-version: '21'
      - name: Validate Maven and Java
        run: |
          java -version
          mvn --version
      - name: Compile, run OSGi tests, build p2 site
        run: mvn -B -ntp clean verify
      - name: Upload p2 installation archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: edt-storage-bridge-p2
          path: repository/org.xander.edt.storagebridge.p2/target/*.zip
          if-no-files-found: error
          retention-days: 3
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tycho-test-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove artifacts from previous builds
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prune = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/prune-artifacts.cjs`);
            await prune({github, context, core});
