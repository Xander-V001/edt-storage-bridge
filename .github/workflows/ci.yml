name: Build and test (manual)

# Never build on push or PR. Explicit user approval required for every invocation.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: storage-bridge-actions
  cancel-in-progress: false

jobs:
  tycho:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      P2_USER: ${{ secrets.P2_USER }}
      P2_TOKEN: ${{ secrets.P2_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk+fx
          cache: maven
      - name: Set up pinned Maven 3.9.9 and JDK 25
        uses: s4u/setup-maven-action@v1.20.0
        with:
          maven-version: '3.9.9'
          java-version: '25'
          java-package: jdk+fx
          server-id: dt_repository
          server-username: P2_USER
          server-password: P2_TOKEN
      - name: Validate Maven and Java
        run: |
          java -version
          mvn --version
      - name: Compile, run OSGi tests, build p2 site
        run: mvn -B -ntp clean verify
      - name: Upload p2 installation archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: edt-storage-bridge-p2
          path: repository/org.xander.edt.storagebridge.p2/target/*.zip
          if-no-files-found: error
          retention-days: 3
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tycho-test-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove artifacts from previous builds
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prune = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/prune-artifacts.cjs`);
            await prune({github, context, core});
